<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pueblo - Banco Azteca</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="azteca">
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>EL PUEBLO</h1>
                <p class="slogan">Datos para transferencia</p>
            </div>

            <div class="bank-section">
                <div class="bank-header azteca">
                    <div class="bank-logo">BANCO AZTECA</div>
                </div>

                <div class="info-group">
                    <label>Tarjeta</label>
                    <div class="card-number">
                        <span>4198</span><span>2257</span><span>0031</span><span>2306</span>
                    </div>
                    <button class="copy-btn" data-label="Copiar tarjeta" onclick="copyText('4198225700312306', this)">Copiar tarjeta</button>
                </div>

                <div class="info-group">
                    <label>Beneficiario</label>
                    <div class="beneficiary">Aldair Morales Gutierrez</div>
                    <button class="copy-btn" data-label="Copiar nombre" onclick="copyText('Aldair Morales Gutierrez', this)">Copiar nombre</button>
                </div>
            </div>

            <div class="footer">
                <p>Gracias por su preferencia</p>
            </div>
        </div>
    </div>
    <script>
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copiado!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = btn.dataset.label;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
